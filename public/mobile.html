<!DOCTYPE html>
<html>
<head>
    <title>Karaoke Remote</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f0f0; margin: 0; padding: 15px; }
        .header { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; text-align: center; }
        .connected { color: #4CAF50; font-weight: bold; margin: 5px 0 0 0; font-size: 0.9rem; }
        
        /* Search Bar Styles */
        .search-container { display: flex; gap: 10px; margin-top: 15px; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        button.search-btn { padding: 12px 20px; background: #2196F3; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        
        /* Results List Styles */
        .result-item { display: flex; gap: 15px; background: white; padding: 10px; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); align-items: center; }
        .result-item img { width: 120px; border-radius: 6px; }
        .result-info { flex: 1; text-align: left; }
        .result-title { font-size: 14px; font-weight: bold; margin: 0 0 5px 0; color: #333; }
        .play-btn { background: #E53935; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
    </style>
</head>
<body>
    <div class="header">
        <h2 style="margin:0;">Karaoke Remote</h2>
        <p id="status">Connecting...</p>
        
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search for a song...">
            <button class="search-btn" onclick="searchYouTube()">Search</button>
            ⏭ Skip Current Song
        </div>
        
    </div>

    <!-- Search results will populate here -->
    <div id="results"></div>

    <script>
        // --- PASTE YOUR API KEY HERE ---
        const YOUTUBE_API_KEY = 'AIzaSyDCBpMLKfz14iCf2P_r7FCRvpyZQF-kiNw'; 
        
        const socket = io();
        const urlParams = new URLSearchParams(window.location.search);
        let roomCode = urlParams.get('room');

        // Connection Logic
        if (!roomCode) {
            roomCode = prompt("Enter the 4-character Room Code shown on the TV:");
        }

        if (roomCode) {
            roomCode = roomCode.toUpperCase();
            socket.emit('join_room', roomCode);
            const statusEl = document.getElementById('status');
            statusEl.innerText = `Connected to Room: ${roomCode}`;
            statusEl.className = "connected";
        } else {
            document.getElementById('status').innerText = "Not connected.";
        }

        // --- YOUTUBE SEARCH LOGIC ---
        async function searchYouTube() {
            const query = document.getElementById('search-input').value;
            if (!query) return;

            // Automatically append "karaoke" to get the right type of videos
            const searchQuery = encodeURIComponent(query + ' karaoke');
            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=10&q=${searchQuery}&type=video&videoEmbeddable=true&key=${YOUTUBE_API_KEY}`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.error) {
                    alert("API Error: " + data.error.message);
                    return;
                }
                
                displayResults(data.items);
            } catch (error) {
                console.error("Search failed:", error);
                alert("Failed to search. Check console for details.");
            }
        }

        function displayResults(videos) {
            const resultsContainer = document.getElementById('results');
            resultsContainer.innerHTML = ''; // Clear old results

            videos.forEach(video => {
                const videoId = video.id.videoId;
                const title = video.snippet.title;
                const thumbUrl = video.snippet.thumbnails.medium.url;

                // Create the HTML for each search result
                const resultDiv = document.createElement('div');
                resultDiv.className = 'result-item';
                
                resultDiv.innerHTML = `
                    <img src="${thumbUrl}" alt="Thumbnail">
                    <div class="result-info">
                        <p class="result-title">${title}</p>
                        <button class="play-btn" onclick="addToQueue('${videoId}', '${title.replace(/'/g, "\\'")}')">Add to Queue</button>
                    </div>
                `;
                
                resultsContainer.appendChild(resultDiv);
            });
        }

        // Send the selected video to the server's queue
function addToQueue(videoId, title) {
    if (roomCode) {
        socket.emit('add_to_queue', { 
            roomCode: roomCode, 
            videoId: videoId,
            title: title
        });
        
        // Clear the search bar to show it was successful
        document.getElementById('search-input').value = '';
        document.getElementById('results').innerHTML = '';
        alert("Added to queue!");
    } else {
        alert("You are not connected to a room!");
    }
}

// Listen for updates from the server and render the queue
socket.on('queue_updated', (queue) => {
    // You'll need an element with id="queue-list" in your HTML to hold this
    let queueContainer = document.getElementById('queue-list');
    
    // If we haven't created the queue container in HTML yet, create it dynamically
    if (!queueContainer) {
        const div = document.createElement('div');
        div.innerHTML = `<h3>Up Next:</h3><div id="queue-list"></div>`;
        document.body.appendChild(div);
        queueContainer = document.getElementById('queue-list');
    }
    
    if (queue.length === 0) {
        queueContainer.innerHTML = '<p>Queue is empty. Search for a song!</p>';
        return;
    }

    queueContainer.innerHTML = '';
    queue.forEach((song, index) => {
        queueContainer.innerHTML += `
            <div style="background: white; padding: 10px; margin-bottom: 5px; border-radius: 6px;">
                <strong>#${index + 1}</strong>: ${song.title}
            </div>
        `;
    });
});

function skipSong() {
    if (roomCode) {
        socket.emit('skip_song', roomCode);
    } else {
        alert("You are not connected to a room!");
    }
}
    </script>
</body>
</html>
